name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # 官方模板写的是 @plugin-sdk-v1，但该 ref 在 t8y2/dbx 上并不存在
    # （2026-10-28 用 git ls-remote 核对过，只有 plugin-cli-v0.1.x 的 tag）。
    # 钉到 main 上该文件最后一次修改的 commit，保证可复现；上游建好 tag 后可切回。
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@859bee2c403bd45f20e17d4d533a62c469a6cad5
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
      # 纯前端插件：只出一个跨平台包，不按五个原生目标重复构建。
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"universal"}]}'
